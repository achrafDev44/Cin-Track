<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinéTrack - Films et Séries</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">

   <header class="bg-gray-800 border-b border-gray-700 p-4">
        <div class="flex items-center gap-3">
            <img src="image/logo2.png" alt="Logo CinéTrack" class="w-12 h-12">
            <h1 class="text-2xl font-bold text-red-500">CinéTrack</h1>
            <img src="image/photo1.png" alt="mon page" class="w-12 h-12 rounded-full object-cover ml-auto">
        </div>
   </header>
    
   <div class="flex flex-1 bg-red-500">

        <main class="flex-1 p-6">
            <!-- recherche,filtre -->     
            <div class="flex items-center gap-4 mb-6">

                <input type="text" id="search" placeholder="Rechercher un film ou une série..."
                class="flex-1 p-4 rounded-xl bg-gray-800 text-white border border-gray-700">

                <select id="filter" class="p-4 rounded-xl bg-gray-800 text-white border border-gray-700">
                    <option value="all">Tous</option>
                    <option value="film">Films</option>
                    <option value="series">Séries</option>
                </select>
            </div>

            <!-- message error api -->
            <div id="error" class="hidden bg-red-600 text-white p-4 text-center rounded mb-4"></div>

            <!-- carte des filmes et series -->
            <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>

            <!-- pagination -->
            <div id="pagination" class="flex justify-center gap-2 mt-6"></div>
        </main>

        <!-- favoris -->
        <div id="sidebar" class="w-64 bg-gray-800 p-4">
            <h2 class="text-xl font-bold mb-4">Mes favoris</h2>
            <ul id="favorites-list" class="space-y-3"></ul>
        </div>   
   </div>
        <!-- modal -->
    <div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-60 items-center justify-center" >
        <div class="bg-gray-800 p-6 rounded-lg w-96">
            <button id="close-modal" class="float-right text-white text-xl bg-red-600 px-3 py-1 rounded">Fermer</button>
            <div id="modal-content" class="text-white"></div>
        </div>
    </div>  

   <footer class="bg-gray-800 border-t border-gray-700 p-4 text-center text-gray-400">2026 © CinéTrack.All rights reserved.</footer>
   
   <script type="module" src="js/main.js"></script>
</body>
</html>
